:root{--bg:#eef2f8;--card:#fff;--ink:#0b1f44;--mute:#6b7a99;--acc:#2f7bff;--line:#dbe3f0;--key:#e8eef9;--head:#0b2a6b;--mine:#2f7bff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1430;--card:#12204a;--ink:#eaf0ff;--mute:#9db0d8;--line:#27396e;--key:#1b2c5c;--head:#07112b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1430;--card:#12204a;--ink:#eaf0ff;--mute:#9db0d8;--line:#27396e;--key:#1b2c5c;--head:#07112b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic","Noto Sans SC",sans-serif}
button,input{font:inherit;color:inherit}
.g{font-family:"EPGEXX",system-ui,sans-serif}
#me{position:relative}
.vb{display:inline-grid;place-items:center;width:1.15em;height:1.15em;margin-left:5px;border-radius:50%;background:#1d9bf0;color:#fff;font:700 .72em system-ui,sans-serif;vertical-align:middle;line-height:1}
.vbav{position:absolute;right:-3px;bottom:-3px;margin:0;width:16px;height:16px;font-size:.6rem;border:2px solid var(--head)}
html.ep body{font-family:"EPGEXX",system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic","Noto Sans SC",sans-serif}
#app{display:flex;height:100%;overflow:hidden}
aside{width:340px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
section{flex:1;display:flex;flex-direction:column;min-width:0}
.top{background:var(--head);color:#fff;padding:10px;display:flex;flex-direction:column;gap:8px}
.top .r{display:flex;gap:8px;align-items:center}
#q{flex:1;border:0;border-radius:18px;padding:8px 14px;background:rgba(255,255,255,.15);color:#fff;outline:0;min-width:0}
#q::placeholder{color:rgba(255,255,255,.7)}
.lg{display:flex;gap:6px}.lg button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:12px;padding:2px 10px;font-size:.75rem;cursor:pointer}
.lg button.on{background:var(--acc);border-color:var(--acc)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.5rem;border:0;flex:none;background:var(--acc)}
#list{flex:1;overflow-y:auto}
.it{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}
.it:hover,.it.on{background:var(--key)}
.tx{min-width:0;flex:1}.tx b,.tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx small{color:var(--mute)}
.tx b.g{font-size:1.3rem;font-weight:400}
.empty{color:var(--mute);text-align:center;padding:30px 16px}
.ad{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:14px;padding:4px 12px;cursor:pointer}
.ad:disabled{opacity:.6}
.hd{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;min-height:56px}
#back{display:none;border:0;background:none;font-size:1.4rem;cursor:pointer}
#ttl.g{font-size:1.4rem}
#ttl{cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:7px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start}
.m.me{align-self:flex-end;background:var(--mine);color:#fff;border-color:var(--mine)}
.m .g{font-size:1.9rem;line-height:1.15;white-space:pre-wrap;word-break:break-word}
.m .tt{white-space:pre-wrap;word-break:break-word}
.m small{display:block;font-size:.68rem;opacity:.7;margin-top:2px}
.note{display:none;background:#fff4e0;color:#7a4b00;font-size:.75rem;padding:6px 12px}
.comp{background:var(--card);border-top:1px solid var(--line);padding:8px 10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bar button{border:1px solid var(--line);background:var(--key);border-radius:12px;padding:3px 12px;font-size:.78rem;cursor:pointer}
#box{min-height:48px;font-size:2rem;line-height:1.2;white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:12px;padding:6px 12px}
#box:after{content:"";display:inline-block;width:2px;height:1.5rem;background:var(--acc);vertical-align:middle;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#lat{font-size:.72rem;color:var(--mute);min-height:1em;margin:2px 4px}
#abc{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:10px 14px;outline:0;display:none}
.row{display:flex;gap:4px;justify-content:center;margin-top:4px}
.k{flex:1;max-width:58px;min-width:0;border:1px solid var(--line);background:var(--key);border-radius:8px;padding:4px 0 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.k .g{font-size:1.5rem;line-height:1.1}.k i{font-style:normal;font-size:.58rem;color:var(--mute)}
.k:active{background:var(--acc);color:#fff}.k.w{max-width:none;flex:1.5;padding:10px 0;font-weight:600}.k.sp{max-width:none;flex:5;padding:10px 0}
.k.sd{background:var(--acc);color:#fff;border-color:var(--acc)}
#mod,#m2{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);place-items:center;padding:16px;z-index:5}
#mod .c,#m2 .c{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px}
#mod input[type=text],#mod textarea,#m2 input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%;outline:0}
#mod label{font-size:.78rem;color:var(--mute)}
#mod .b,#m2 .b{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#mod button,#m2 button{border:1px solid var(--line);background:var(--key);border-radius:10px;padding:7px 16px;cursor:pointer}
#mod .pr,#m2 .pr{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (max-width:720px){aside{width:100%}section{display:none;width:100%}#app.open aside{display:none}#app.open section{display:flex}#back{display:block}.m{max-width:88%}}

/* ===== v5: FLASH, rooms, badges, daily question, stickers, polls ===== */
#xch{display:flex;gap:8px;overflow-x:auto;max-width:640px;margin:0 auto;padding:8px 12px 2px;scrollbar-width:none}#xch::-webkit-scrollbar{display:none}#xch .xbt{flex:none;white-space:nowrap}
.xbt{border:1px solid var(--line);background:var(--key);color:var(--ink);border-radius:18px;padding:7px 14px;cursor:pointer}.xbt.pr{background:var(--acc);color:#fff;border-color:var(--acc)}
#xpn{display:none;position:fixed;inset:0;z-index:70;background:var(--bg);flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#xpn .pfh2 button{border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--ink)}
#xpb{flex:1;overflow-y:auto;max-width:640px;width:100%;margin:0 auto;padding:10px 12px 24px}
.xc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}.xc.hero{background:var(--head);color:#fff;border:0}.xq{font-size:1.25rem;line-height:1.3}
.xs{color:var(--mute);font-size:.78rem}.xh{font-weight:700;margin:14px 2px 2px}
.xi{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;width:100%;outline:0}
.xrow{display:flex;gap:8px;flex-wrap:wrap}.xr{display:flex;gap:10px;align-items:center}
.xo{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:linear-gradient(90deg,var(--key) var(--w,0%),transparent var(--w,0%));border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;color:var(--ink)}.xo.on{border-color:var(--acc);font-weight:700}.xo i{font-style:normal;color:var(--mute)}
.xbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.xbd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px;opacity:.55;filter:grayscale(1)}.xbd.on{opacity:1;filter:none;border-color:var(--acc)}.xi2{font-size:2rem}
.xp{height:5px;background:var(--key);border-radius:3px;overflow:hidden}.xp i{display:block;height:100%;background:var(--acc)}
#rbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--head);color:#fff;border-radius:22px;padding:5px 6px 5px 16px;gap:10px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}#rbar span{cursor:pointer}
#strip{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--line);padding:3px 12px}#strip button{border:0;background:none;color:var(--acc);cursor:pointer;font-size:.82rem}#stkb{font-weight:700;font-size:.85rem}
#skt{display:none;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;padding:6px}
.stt{display:flex;gap:4px;overflow-x:auto}.stt button{flex:none;border:0;background:none;color:var(--ink);padding:4px 10px;border-radius:12px;cursor:pointer;font-size:.8rem}.stt .on{background:var(--key);font-weight:700}
.stg{display:flex;flex-wrap:wrap;gap:4px;max-height:170px;overflow-y:auto;padding:6px 0}.stc{border:0;background:none;width:25%;min-width:62px;cursor:pointer;padding:2px}
.stk{font-size:2.6rem;line-height:1;display:inline-block}.stk img{width:96px;height:96px;object-fit:contain}.stc .stk{font-size:2.2rem}.stc .stk img{width:56px;height:56px}
.m:has(.stk),.m.me:has(.stk){background:none;border-color:transparent}
.pop{animation:a1 1.4s ease-in-out infinite}.beat{animation:a2 1s ease-in-out infinite}.bounce{animation:a3 .9s ease-in-out infinite}.shake{animation:a4 .7s ease-in-out infinite}.spin{animation:a5 2.2s linear infinite}.float{animation:a6 2.4s ease-in-out infinite}.flick{animation:a2 .5s ease-in-out infinite alternate}
@keyframes a1{50%{transform:scale(1.18)}}@keyframes a2{50%{transform:scale(1.25)}}@keyframes a3{50%{transform:translateY(-10px)}}@keyframes a4{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes a5{to{transform:rotateY(360deg)}}@keyframes a6{50%{transform:translateY(-6px) rotate(4deg)}}
.rxs{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}.rx{background:rgba(127,127,127,.2);border-radius:10px;padding:0 6px;font-size:.8rem}.rx.new{animation:a7 .4s}@keyframes a7{0%{transform:scale(0)}70%{transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.stk,.rx{animation:none!important}}

#lvv{display:none;position:fixed;inset:0;z-index:85;background:#000;color:#fff;flex-direction:column;justify-content:space-between;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#lvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#lvt,#lvb,#lvc{position:relative;z-index:2}#lvt{display:flex;gap:10px;align-items:center;padding:10px;background:linear-gradient(rgba(0,0,0,.55),transparent)}#lvt b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lvt button,#lvb button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:22px;min-width:42px;height:42px;font-size:1.1rem;cursor:pointer;padding:0 12px}
#lvc{max-height:34%;overflow-y:auto;padding:0 12px;display:flex;flex-direction:column;gap:3px;font-size:.9rem;text-shadow:0 1px 4px #000;width:78%}
#lvb{display:flex;gap:8px;padding:10px}#lvb input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:22px;padding:10px 14px;outline:0}#lvb input::placeholder{color:rgba(255,255,255,.7)}
#lvfx{position:absolute;right:0;bottom:70px;width:80px;top:30%;pointer-events:none;z-index:3}.lvf{position:absolute;bottom:0;font-size:1.8rem;animation:lvu 2s ease-out forwards}@keyframes lvu{to{transform:translateY(-240px);opacity:0}}
#fpw{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);place-items:center;padding:16px}#fpw .c{position:relative;background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px}#fpw .c>b{padding-right:34px}#fpm{font-size:.82rem;color:var(--mute);min-height:1em}
.xsw{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ===== v7: LIVE ring (brown) ===== */
.sw.sl{padding:3px;background:linear-gradient(135deg,#a0522d,#5c2e0e);animation:lvp 1.8s ease-in-out infinite}
.sw.sl .av{border:3px solid var(--card)}
.sw .lvtag{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);background:#8b4513;color:#fff;font:700 .55rem system-ui,sans-serif;letter-spacing:.3px;line-height:1;padding:2px 5px;border-radius:6px;border:1.5px solid var(--card);z-index:2;pointer-events:none}
@keyframes lvp{50%{box-shadow:0 0 0 4px rgba(139,69,19,.35)}}
@media (prefers-reduced-motion:reduce){.sw.sl{animation:none}}

/* ===== v8: filters, gifts, wallet, battles ===== */
#fxp{display:none;position:absolute;left:0;right:0;bottom:64px;z-index:4;background:rgba(0,0,0,.55);padding:8px 6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#fxp button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:6px 12px;margin:0 3px;cursor:pointer;font-size:.8rem}
#fxp button.on{background:var(--acc);border-color:var(--acc)}
#btb{display:none;position:absolute;top:58px;left:10px;right:10px;z-index:3;background:rgba(0,0,0,.6);border-radius:12px;padding:6px 10px;font-size:.85rem;text-align:center}
#btb i{display:block;height:6px;border-radius:3px;margin-top:4px;background:linear-gradient(90deg,#2f7bff var(--p,50%),#e0457b var(--p,50%))}
.gfx{position:absolute;left:50%;top:42%;font-size:6rem;z-index:6;pointer-events:none;transform:translate(-50%,-50%);animation:gfa 2.8s ease-out forwards}
.gfx.big{font-size:9rem;animation:gfb 3.4s ease-out forwards}
@keyframes gfa{0%{transform:translate(-50%,-30%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
@keyframes gfb{0%{transform:translate(-160%,-50%) scale(.6);opacity:0}25%{transform:translate(-50%,-50%) scale(1.3);opacity:1}75%{transform:translate(-50%,-50%) scale(1.5) rotate(6deg);opacity:1}100%{transform:translate(80%,-50%) scale(2);opacity:0}}

#fxp{overflow:visible;white-space:normal;padding:6px 8px;bottom:64px}
#fxp .ft,#fxp .fr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 0}
#fxp .ft button{border-radius:14px;padding:5px 11px;font-size:.78rem;flex:none;margin:0}
#fxp .fr button{flex:none;margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;padding:4px 6px;font-size:.68rem;min-width:58px}
#fxp .fr canvas{width:54px;height:40px;border-radius:8px;background:#222}
#fxp .fr .em{font-size:1.5rem;line-height:40px}
#fxp .fr label{color:#fff;font-size:.78rem;display:flex;align-items:center;gap:6px;flex:none}
#fxp small{display:block;color:#ffd8a8;min-height:1em;font-size:.72rem}

/* ===== v10: streamer + audience dashboards ===== */
#lsh{display:none;position:absolute;left:0;right:0;bottom:0;max-height:72%;z-index:7;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
@media (min-width:900px){#lsh{left:auto;top:0;width:390px;max-height:none;border-radius:0}}
#lsh .lsh-h{display:flex;gap:4px;overflow-x:auto;padding:8px;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#lsh .lsh-h button{flex:none;border:0;background:none;color:var(--mute);padding:7px 11px;border-radius:14px;cursor:pointer;font-size:.82rem}
#lsh .lsh-h button.on{background:var(--acc);color:#fff;font-weight:700}
#lsh .lsh-b{overflow-y:auto;padding:10px;flex:1}
#lsh .sg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#lsh .st{background:var(--key);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}#lsh .st b{font-size:1.25rem}#lsh .st small{color:var(--mute)}
#lsh .cr2{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}#lsh .cr2>span{flex:1;min-width:0;word-break:break-word;font-size:.88rem}
#lsh .cr2 button{border:0;background:var(--key);border-radius:8px;padding:5px 7px;cursor:pointer;font-size:.9rem}
#lsh .gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#lsh .gg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}#lsh .gg button:disabled{opacity:.45}#lsh .gg .e{font-size:2rem}
#lov{position:absolute;left:10px;right:10px;top:104px;z-index:3;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#lov .pn2{background:rgba(0,0,0,.55);border-radius:10px;padding:5px 10px;font-size:.82rem}
#lov .gl{background:rgba(0,0,0,.55);border-radius:10px;padding:5px 10px;font-size:.8rem}#lov .gl i{display:block;height:5px;border-radius:3px;margin-top:4px;background:linear-gradient(90deg,#ffd43b,#ff922b)}

/* scroll arrows for top chips row */
#xchw{display:flex;align-items:center;gap:4px;max-width:640px;margin:0 auto;padding:0 6px;position:sticky;top:0;z-index:3;background:var(--bg)}
#xchw #xch{flex:1;min-width:0;max-width:none;margin:0;scroll-behavior:smooth}
#xchw>button{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--acc);color:#fff;font-size:1.3rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#xchw>button.off{visibility:hidden}
/* LIVE sheet: keep the X always visible */
#lsh .lsh-h button.lsh-x{position:sticky;right:0;margin-left:auto;background:var(--card);color:var(--ink);font-weight:700;font-size:1.05rem;box-shadow:-8px 0 8px var(--card)}

#npill{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:50;border:0;border-radius:20px;background:var(--acc);color:#fff;padding:8px 16px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer}

/* EPGEXX logo */
