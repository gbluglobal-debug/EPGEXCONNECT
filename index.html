:root{--bg:#eef2f8;--card:#fff;--ink:#0b1f44;--mute:#6b7a99;--acc:#2f7bff;--line:#dbe3f0;--key:#e8eef9;--head:#0b2a6b;--mine:#2f7bff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1430;--card:#12204a;--ink:#eaf0ff;--mute:#9db0d8;--line:#27396e;--key:#1b2c5c;--head:#07112b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1430;--card:#12204a;--ink:#eaf0ff;--mute:#9db0d8;--line:#27396e;--key:#1b2c5c;--head:#07112b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic","Noto Sans SC",sans-serif}
button,input{font:inherit;color:inherit}
.g{font-family:"EPGEXX",system-ui,sans-serif}
#me{position:relative}
.vb{display:inline-grid;place-items:center;width:1.15em;height:1.15em;margin-left:5px;border-radius:50%;background:#1d9bf0;color:#fff;font:700 .72em system-ui,sans-serif;vertical-align:middle;line-height:1}
.vbav{position:absolute;right:-3px;bottom:-3px;margin:0;width:16px;height:16px;font-size:.6rem;border:2px solid var(--head)}
html.ep body{font-family:"EPGEXX",system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic","Noto Sans SC",sans-serif}
#app{display:flex;height:100%;overflow:hidden}
aside{width:340px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
section{flex:1;display:flex;flex-direction:column;min-width:0}
.top{background:var(--head);color:#fff;padding:10px;display:flex;flex-direction:column;gap:8px}
.top .r{display:flex;gap:8px;align-items:center}
#q{flex:1;border:0;border-radius:18px;padding:8px 14px;background:rgba(255,255,255,.15);color:#fff;outline:0;min-width:0}
#q::placeholder{color:rgba(255,255,255,.7)}
.lg{display:flex;gap:6px}.lg button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:12px;padding:2px 10px;font-size:.75rem;cursor:pointer}
.lg button.on{background:var(--acc);border-color:var(--acc)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.5rem;border:0;flex:none;background:var(--acc)}
#list{flex:1;overflow-y:auto}
.it{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}
.it:hover,.it.on{background:var(--key)}
.tx{min-width:0;flex:1}.tx b,.tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx small{color:var(--mute)}
.tx b.g{font-size:1.3rem;font-weight:400}
.empty{color:var(--mute);text-align:center;padding:30px 16px}
.ad{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:14px;padding:4px 12px;cursor:pointer}
.ad:disabled{opacity:.6}
.hd{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;min-height:56px}
#back{display:none;border:0;background:none;font-size:1.4rem;cursor:pointer}
#ttl.g{font-size:1.4rem}
#ttl{cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:7px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start}
.m.me{align-self:flex-end;background:var(--mine);color:#fff;border-color:var(--mine)}
.m .g{font-size:1.9rem;line-height:1.15;white-space:pre-wrap;word-break:break-word}
.m .tt{white-space:pre-wrap;word-break:break-word}
.m small{display:block;font-size:.68rem;opacity:.7;margin-top:2px}
.note{display:none;background:#fff4e0;color:#7a4b00;font-size:.75rem;padding:6px 12px}
.comp{background:var(--card);border-top:1px solid var(--line);padding:8px 10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bar button{border:1px solid var(--line);background:var(--key);border-radius:12px;padding:3px 12px;font-size:.78rem;cursor:pointer}
#box{min-height:48px;font-size:2rem;line-height:1.2;white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:12px;padding:6px 12px}
#box:after{content:"";display:inline-block;width:2px;height:1.5rem;background:var(--acc);vertical-align:middle;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#lat{font-size:.72rem;color:var(--mute);min-height:1em;margin:2px 4px}
#abc{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:10px 14px;outline:0;display:none}
.row{display:flex;gap:4px;justify-content:center;margin-top:4px}
.k{flex:1;max-width:58px;min-width:0;border:1px solid var(--line);background:var(--key);border-radius:8px;padding:4px 0 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.k .g{font-size:1.5rem;line-height:1.1}.k i{font-style:normal;font-size:.58rem;color:var(--mute)}
.k:active{background:var(--acc);color:#fff}.k.w{max-width:none;flex:1.5;padding:10px 0;font-weight:600}.k.sp{max-width:none;flex:5;padding:10px 0}
.k.sd{background:var(--acc);color:#fff;border-color:var(--acc)}
#mod,#m2{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);place-items:center;padding:16px;z-index:5}
#mod .c,#m2 .c{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px}
#mod input[type=text],#mod textarea,#m2 input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%;outline:0}
#mod label{font-size:.78rem;color:var(--mute)}
#mod .b,#m2 .b{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function unb64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
async function derive(pw,saltHex){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);var u=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:unhex(saltHex),iterations:150000},k,512));return{ver:hex(u.slice(0,32)),key:hex(u.slice(32))}}
function aesKey(kh){return crypto.subtle.importKey("raw",unhex(kh),"AES-GCM",false,["encrypt","decrypt"])}
async function enc(kh,o){var iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},await aesKey(kh),new TextEncoder().encode(JSON.stringify(o)));return{iv:hex(iv),ct:b64(new Uint8Array(ct))}}
async function dec(kh,d){var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unhex(d.iv)},await aesKey(kh),unb64(d.ct));return JSON.parse(new TextDecoder().decode(pt))}
